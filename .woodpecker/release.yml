when:
  event: [release]

steps:
  notify:
    image: git.cflmy.cn/cflmy/marqdo-ci-shell:3.0.0-rc.5
    environment:
      WOODPECKER_NOTIFY_TOKEN:
        from_secret: woodpecker_notify_token
    commands:
      - |
        set -eu
        test -n "${WOODPECKER_NOTIFY_TOKEN:?woodpecker_notify_token secret missing}"
        python3 scripts/release/notify_root.py \
          --hint-component "view" \
          --hint-tag "${CI_COMMIT_TAG:-}"
