[package]
name = "marqdo-view"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Marqdo View: read .mq.md documents as documents, with optional verified Analysis v2 and Trace v2"
repository = "https://github.com/cflmy/marqdo-view"
readme = "README.md"
keywords = ["marqdo", "markdown", "reader", "executable-document"]
categories = ["command-line-utilities", "documentation"]

[[bin]]
name = "marqdo-view"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
comrak = { version = "=1.0.0", default-features = false }
semver = "1"
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
