name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frozen-acceptance:
    name: frozen CLI acceptance (Tool install / SSE / export / browser)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "8388608"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tests/.cache/pw-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the official frozen core and verify its identity
        shell: bash
        run: |
          set -euo pipefail
          frozen="$(scripts/frozen-beta.sh fetch "$RUNNER_TEMP/marqdo-frozen")"
          echo "MARQDO_BIN=$frozen" >> "$GITHUB_ENV"
      - name: Install Chromium and run the full acceptance gate
        run: |
          (cd tests/browser && npm ci --no-audit --no-fund)
          (cd tests/browser && npx playwright install --with-deps chromium)
          scripts/acceptance.sh
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: view-evidence-${{ github.sha }}
          path: |
            dist/acceptance/manifest.json
            dist/marqdo-view-*.tar.gz
            dist/marqdo-view-*.tar.gz.sha256
          if-no-files-found: error
