# The published beta needs glibc 2.39. Use the matching Playwright image
# so the installed-tool tests get both Ubuntu Noble and Chromium.
when:
  - event: [pull_request, manual]
  - event: push
    branch: master

steps:
  frozen-acceptance:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RUST_MIN_STACK: "8388608"
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential ca-certificates curl git python3
      - curl -fsSL --retry 3 https://sh.rustup.rs -o /tmp/marqdo-view-rustup.sh
      - sh /tmp/marqdo-view-rustup.sh -y --profile minimal --default-toolchain 1.89.0 --component rustfmt --component clippy --no-modify-path
      - export PATH="$HOME/.cargo/bin:$PATH"
      - (cd tests/browser && npm ci --no-audit --no-fund)
      - |
        frozen_dir="$(mktemp -d)"
        MARQDO_BIN="$(scripts/frozen-beta.sh fetch "$frozen_dir")"
        export MARQDO_BIN
        scripts/acceptance.sh
        cat dist/acceptance/manifest.json
